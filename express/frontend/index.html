<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>document</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <div class="form-box">
    
      <div class="button-box">
        <button type="button" class="toggle-btn active" id="loginTab">Login</button>
        <button type="button" class="toggle-btn" id="signupTab">Sign Up</button>
      </div>

     
      <form id="loginForm" class="form active-form" >
        <h2>Welcome Back</h2>

        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" name="email" placeholder="Enter your email" required />
        </div>

        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" placeholder="Enter your password" required />
        </div>

       

        <button type="submit"  id="loginid"class="submit-btn">Login</button>
      </form>


      <form id="signupForm" class="form" >
        <h2>Create Account</h2>

        <div class="input-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" name="name" placeholder="Enter your name" required />
        </div>

        <div class="input-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" name="email" placeholder="Enter your email" required />
        </div>

        <div class="input-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" placeholder="Create a password" required />
        </div>

        
        <div class="input-group">
          <label for="signup-role">Select Role</label>
          <select id="signup-role" name="role" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">Sign Up</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
