<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYZ COLLEGE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div>
            <h1>XYZ COLLEGE</h1>
        </div>
        <div>
            <nav id="main-nav">
                <a href="#home" id="nav-home" data-section="home">Home</a>
                <a href="#courses" id="nav-courses" data-section="courses">Courses</a>
                <a href="#about" id="nav-about" data-section="about">About</a>
                <a href="#students" id="nav-students" data-section="students">Students</a>
                <a href="#facilities" id="nav-facilities" data-section="facilities">Facilities</a>
                <a href="#placements" id="nav-placements" data-section="placements">Placements</a>
                <a href="#contact" id="nav-contact" data-section="contact">Contact</a>
            </nav>
        </div>
    </header>

    <main id="app-content">
        <section id="home-section" class="content-section">
        </section>

        <section id="courses-section" class="content-section" style="display: none;">
            <h2>Available Courses</h2>
            <div id="courses-list-container"></div>
        </section>

        <section id="about-section" class="content-section" style="display: none;">
            <h2>About Our College</h2>
            <div id="about-details-container"></div>
        </section>

        <section id="students-section" class="content-section" style="display: none;">
            <h2>Student Directory</h2>
            <div id="students-list-container"></div>
        </section>

        <section id="facilities-section" class="content-section" style="display: none;">
            <h2>Campus Facilities</h2>
            <div id="facilities-list-container"></div>
        </section>

        <section id="placements-section" class="content-section" style="display: none;">
            <h2>Placement Statistics & Records</h2>
            <div id="placement-stats-container"></div>
        </section>

        <section id="contact-section" class="content-section" style="display: none;">
            <h2>Contact Us</h2>
            <div id="contact-info-container"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
